[build]
  command = "npm run build"
  publish = "dist"

# Every production deploy costs Netlify credits, so skip the ones that cannot change
# what is served (docs, tests, CI config, promo assets). Exit 0 = no relevant changes =
# skip; a missing CACHED_COMMIT_REF makes git exit non-zero, so it fails open.
# Production only: deploy previews are free and stay on for review.
[context.production]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)e2e' ':(exclude).github' ':(exclude).husky' ':(exclude)*.md'"

[dev]
  command = "npm run dev"

# SPA fallback - all routes serve index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
