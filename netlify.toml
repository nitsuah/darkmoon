[build]
  command = "npm run build"
  publish = "dist"

# Every production deploy costs Netlify credits, so skip the ones that cannot change
# what is served (docs, tests, CI config, promo assets). Exit 0 = no relevant changes =
# skip; an empty CACHED_COMMIT_REF or COMMIT_REF is guarded explicitly (exit 1 = build), so it fails open.
# Production only: deploy previews are free and stay on for review.
[context.production]
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test -n \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)docs' ':(exclude)e2e' ':(exclude).github' ':(exclude).husky' ':(exclude)*.md' ':(exclude,glob)src/**/__tests__/**' ':(exclude,glob)src/**/*.test.*'"
[dev]
  command = "npm run dev"

# SPA fallback - all routes serve index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
